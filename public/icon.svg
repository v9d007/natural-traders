<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="48" height="48" rx="14" fill="#064E3B"/>
  <rect x="2" y="2" width="44" height="44" rx="12" fill="#022C22" stroke="#10B981" stroke-width="2" stroke-opacity="0.5"/>
  
  <defs>
    <linearGradient id="ntSvgGradient" x1="18" y1="10" x2="30" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34D399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="ntGoldDotSvg" x1="26" y1="5" x2="32" y2="11" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDE047"/>
      <stop offset="1" stop-color="#EAB308"/>
    </linearGradient>
  </defs>

  <g transform="translate(5, 5)">
    <!-- Geometric Letter 'N' -->
    <path d="M10 27V11L21 24.5V11" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Interlocking Geometric Letter 'T' -->
    <path d="M19 11H29" stroke="url(#ntSvgGradient)" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M24 11V27" stroke="url(#ntSvgGradient)" stroke-width="3.2" stroke-linecap="round"/>

    <!-- Golden Spark / Sunrise Accent -->
    <circle cx="30" cy="7.5" r="2.8" fill="url(#ntGoldDotSvg)"/>
    <circle cx="30" cy="7.5" r="1.2" fill="#FFFFFF"/>
  </g>
</svg>
